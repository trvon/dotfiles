<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
    <!-- Font rendering.
         hintslight is the sane default for LCDs; `rgba`/`lcdfilter` are left
         at fontconfig's defaults on purpose. If your panel is a normal RGB
         stripe LCD and you want thicker subpixel antialiasing, uncomment:

         <edit name="rgba" mode="assign"><const>rgb</const></edit>
         <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
    -->
    <match target="font">
        <edit name="antialias" mode="assign"><bool>true</bool></edit>
        <edit name="hinting" mode="assign"><bool>true</bool></edit>
        <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    </match>

    <!-- Configs that name fonts the way the upstream projects do, not the way
         the installed families are actually called. fontconfig-based lookups
         (Ghostty, some Electron/Qt apps) take these strings literally and fall
         back to Noto Sans otherwise; Pango-based ones fuzzy-match and are fine.
         The installed families are "FiraCode Nerd Font" and
         "RobotoMono Nerd Font". -->
    <match target="pattern">
        <test name="family"><string>Fira Code</string></test>
        <edit name="family" mode="assign" binding="same"><string>FiraCode Nerd Font</string></edit>
    </match>
    <match target="pattern">
        <test name="family"><string>RobotoMono NerdFont</string></test>
        <edit name="family" mode="assign" binding="same"><string>RobotoMono Nerd Font</string></edit>
    </match>
</fontconfig>
