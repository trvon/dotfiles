model:
  provider: minimax
  default: MiniMax-M2.7
  context_length: 204800
  max_tokens: 65536

terminal:
  backend: local
  cwd: /workspace/dotfiles
  timeout: 180
  lifetime_seconds: 300

compression:
  enabled: true
  threshold: 0.5
  summary_provider: main
  summary_model: MiniMax-M2.7

auxiliary:
  web_extract:
    provider: main
    model: MiniMax-M2.7
    timeout: 60
  approval:
    provider: main
    model: MiniMax-M2.7
    timeout: 60
  session_search:
    provider: main
    model: MiniMax-M2.7
    timeout: 60
  skills_hub:
    provider: main
    model: MiniMax-M2.7
    timeout: 60
  mcp:
    provider: main
    model: MiniMax-M2.7
    timeout: 60
  flush_memories:
    provider: main
    model: MiniMax-M2.7
    timeout: 60

mcp_servers:
  searxng:
    command: mcp-searxng
    env:
      SEARXNG_URL: http://searxng:8080
    tools:
      include: [searxng_web_search]
      resources: false
      prompts: false
  yams:
    command: yams
    args: ["serve", "--daemon-socket", "/tmp/yams-daemon.sock"]
    tools:
      include: [query]
      resources: false
      prompts: false

display:
  streaming: true

gateway:
  timeout: 300

approvals:
  mode: off
  timeout: 60
skills:
  external_dirs:
    - /workspace/dotfiles/hermes/skills
    - /root/.local/share/sage/ide-exports/hermes/libraries

