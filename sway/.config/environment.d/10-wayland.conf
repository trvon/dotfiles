# Session env for Wayland-native apps (read by systemd --user, and so by
# D-Bus/portal-activated apps). Replaces the old `swaymsg setenv` lines,
# which were no-ops: sway has no setenv command.
MOZ_ENABLE_WAYLAND=1
QT_QPA_PLATFORM=wayland;xcb
ELECTRON_OZONE_PLATFORM_HINT=auto
GDK_BACKEND=wayland,x11
