# Resource stolen from elreydetoda : https://github.com/elreydetoda

# --- Terminal ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-kitty:RGB,foot*:RGB,xterm-256color:RGB"
set -as terminal-features ",*:extkeys"
set -s extended-keys on
set -s escape-time 10        # don't lag <Esc> in nvim
set -s set-clipboard on      # OSC 52 copy to system clipboard
set -g focus-events on
set -g history-limit 50000

#make it have purtty colors

set-option -g status-bg colour235
set-option -g status-fg colour136

set-option -g display-panes-active-colour colour33 #blue
set-option -g display-panes-colour colour166 #orange
set-window-option -g clock-mode-colour green #green
set -g status-interval 5
set -g status-justify centre # center align window list
set -g status-left-length 20
set -g status-right-length 140
set -g status-left '#[fg=green]#H #[fg=black]• #[fg=green,bright]#(uname -r | cut -c 1-6)#[default]'
set -g status-right '#[fg=red,dim,bg=default]#(uptime | cut -f 4-5 -d " " | cut -f 1 -d ",") #[fg=white,bg=default]%a%l:%M %p#[default] #[fg=blue,bright]%Y-%m-%d'

setw -g aggressive-resize on

# reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."
# auto window rename
set-window-option -g automatic-rename

set -g base-index 1 #cause zero is all the way at the other end of the keyboard
setw -g pane-base-index 1
set -g renumber-windows on
set-window-option -g mode-keys vi # i dont use emacs bro
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

setw -g monitor-activity on
set -g mouse on
set -g visual-activity on

# switching windows
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
